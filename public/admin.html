<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashew Orders — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>

<body>
  <div class="page" id="login-screen">
    <header class="app-header">
      <span class="header-spacer" aria-hidden="true"></span>
      <div class="header-titles">
        <h1>
          <img class="brand-logo" src="logo.png?v=3" alt="Panruti Cashew logo" width="64" height="64" />
          Dashboard
        </h1>
        <p>Sign in to manage orders</p>
      </div>
      <div class="theme-toggle-wrap">
        <label class="theme-toggle" for="theme-toggle-checkbox-login">
          <span class="visually-hidden">Toggle dark mode</span>
          <input type="checkbox" role="switch" id="theme-toggle-checkbox-login" class="theme-toggle-input" />
          <span class="theme-toggle-track" aria-hidden="true">
            <span class="theme-toggle-thumb"></span>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </span>
        </label>
      </div>
    </header>

    <div id="login-status" class="status-message"></div>

    <div class="card">
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="text" id="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <div class="button-row">
          <button type="submit" class="primary" id="login-btn">Sign In</button>
        </div>
      </form>
    </div>
  </div>

  <div class="page wide" id="dashboard-screen" hidden>
    <header class="app-header">
      <span class="header-spacer" aria-hidden="true"></span>
      <div class="header-titles">
        <h1>
          <img class="brand-logo" src="logo.png?v=3" alt="Panruti Cashew logo" width="64" height="64" />
          Dashboard
        </h1>
        <p class="tagline">Manage customer orders</p>
      </div>
      <div class="theme-toggle-wrap">
        <label class="theme-toggle" for="theme-toggle-checkbox-dashboard">
          <span class="visually-hidden">Toggle dark mode</span>
          <input type="checkbox" role="switch" id="theme-toggle-checkbox-dashboard" class="theme-toggle-input" />
          <span class="theme-toggle-track" aria-hidden="true">
            <span class="theme-toggle-thumb"></span>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </span>
        </label>
      </div>
    </header>

    <div class="card">
      <div class="product-manage-row" id="product-view">
        <div class="product-row">
          <span class="name" id="product-name-display">Loading…</span>
          <span class="price" id="product-price-display"></span>
        </div>
        <button type="button" class="icon-btn" id="product-edit-btn" aria-label="Edit product">✏️</button>
      </div>
      <form id="product-edit-form" hidden>
        <div class="field">
          <label for="product-name-input">Product Name</label>
          <input type="text" id="product-name-input" required />
        </div>
        <div class="field">
          <label for="product-price-input">Price (₹)</label>
          <input type="number" id="product-price-input" min="1" step="1" required />
        </div>
        <div id="product-status" class="status-message"></div>
        <div class="button-row">
          <button type="button" class="secondary" id="product-cancel-btn">Cancel</button>
          <button type="submit" class="primary" id="product-save-btn">Save</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="freeze-row">
        <div>
          <div class="freeze-title">Order Freeze</div>
          <div class="freeze-state" id="freeze-state">Loading…</div>
        </div>
        <button type="button" class="danger" id="freeze-btn" disabled>Freeze Orders</button>
      </div>
    </div>

    <div class="summary-bar">
      <div class="summary-stat">
        <div class="num" id="open-count">0</div>
        <div class="label">Open Orders</div>
      </div>
      <div class="summary-stat">
        <div class="num" id="open-total">₹0</div>
        <div class="label">Pending Amount</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-filter="open">Open</button>
      <button class="tab-btn" data-filter="closed">Closed</button>
      <button class="tab-btn" data-filter="cancelled">Cancelled</button>
      <button class="tab-btn" data-filter="all">All</button>
    </div>

    <div id="orders-container"></div>

    <div class="button-row">
      <button type="button" class="secondary" id="logout-btn">Sign Out</button>
    </div>

    <footer class="admin-link-hint">This page is unlisted — don't share this link with customers.</footer>
  </div>

  <script type="module">
    import { collection, onSnapshot, query, orderBy, doc, getDoc, setDoc, updateDoc, deleteDoc, deleteField, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { db, auth } from "./firebase-config.js";
    import { flatKey } from "./flat-key.js";

    const loginScreen = document.getElementById("login-screen");
    const dashboardScreen = document.getElementById("dashboard-screen");
    const loginForm = document.getElementById("login-form");
    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const loginBtn = document.getElementById("login-btn");
    const loginStatusEl = document.getElementById("login-status");
    const logoutBtn = document.getElementById("logout-btn");

    const ordersContainer = document.getElementById("orders-container");
    const openCountEl = document.getElementById("open-count");
    const openTotalEl = document.getElementById("open-total");
    const tabButtons = document.querySelectorAll(".tab-btn");

    const productView = document.getElementById("product-view");
    const productEditForm = document.getElementById("product-edit-form");
    const productNameDisplay = document.getElementById("product-name-display");
    const productPriceDisplay = document.getElementById("product-price-display");
    const productEditBtn = document.getElementById("product-edit-btn");
    const productCancelBtn = document.getElementById("product-cancel-btn");
    const productSaveBtn = document.getElementById("product-save-btn");
    const productNameInput = document.getElementById("product-name-input");
    const productPriceInput = document.getElementById("product-price-input");
    const productStatusEl = document.getElementById("product-status");
    const productDocRef = doc(db, "config", "product");

    const freezeStateEl = document.getElementById("freeze-state");
    const freezeBtn = document.getElementById("freeze-btn");
    const settingsDocRef = doc(db, "config", "settings");

    let allOrders = [];
    let currentFilter = "open";
    let unsubscribeOrders = null;
    let unsubscribeProduct = null;
    let unsubscribeSettings = null;
    let ordersFrozen = false;
    let currentProduct = { name: "Whole Cashews (500 gms)", price: 500 };

    tabButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    function formatDate(ts) {
      if (!ts || !ts.toDate) return "—";
      return ts.toDate().toLocaleString(undefined, {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    let editingOrderId = null;

    async function markClosed(orderId) {
      try {
        await updateDoc(doc(db, "orders", orderId), {
          status: "closed",
          closedAt: serverTimestamp(),
        });
      } catch (err) {
        console.error(err);
        alert("Could not update order. Please try again.");
      }
    }

    // Reopening also points openOrders/{mobile} at the order so the customer page finds it again,
    // unless that number already has another open order (a number shows only one open order).
    async function reopenOrder(orderId) {
      const order = allOrders.find((o) => o.id === orderId);
      if (!order) return;
      const otherOpen = order.mobile && allOrders.find(
        (o) => o.id !== orderId && o.status === "open" && o.mobile === order.mobile
      );
      const question = otherOpen
        ? `Mobile ${order.mobile} already has another open order (${otherOpen.apartment} · ${otherOpen.flatNumber}). ` +
          "Reopen this one anyway? The customer page will keep showing the other order."
        : "Reopen this order?";
      if (!confirm(question)) return;
      try {
        const batch = writeBatch(db);
        batch.update(doc(db, "orders", orderId), {
          status: "open",
          closedAt: null,
          cancelledAt: deleteField(),
        });
        if (order.mobile && !otherOpen) {
          batch.set(doc(db, "openOrders", order.mobile), { orderId });
        }
        await batch.commit();
      } catch (err) {
        console.error(err);
        alert("Could not reopen order. Please try again.");
      }
    }

    // Open orders for the same apartment and flat may be duplicates. Flat numbers are compared
    // ignoring case, spaces and punctuation, so "A-204" and "a 204" match.
    function orderFlatKey(order) {
      return flatKey(order.apartment, order.flatNumber);
    }

    function openCountsByFlat() {
      const counts = new Map();
      allOrders.forEach((o) => {
        if (o.status === "open") counts.set(orderFlatKey(o), (counts.get(orderFlatKey(o)) || 0) + 1);
      });
      return counts;
    }

    // Make sure every open order's flat has an openFlats pointer to an open order for that flat, so
    // the customer page can find it. This covers orders placed before openFlats existed, reopened
    // orders and admin edits. Pointers already confirmed this session are not re-read.
    const confirmedFlatPointers = new Map();
    let syncingFlatPointers = false;
    let flatPointerSyncPending = false;

    async function syncFlatPointers() {
      if (syncingFlatPointers) {
        flatPointerSyncPending = true;
        return;
      }
      syncingFlatPointers = true;
      try {
        const openOrders = allOrders.filter((o) => o.status === "open");
        const isValid = (key, orderId) => openOrders.some((o) => o.id === orderId && orderFlatKey(o) === key);
        for (const order of openOrders) {
          const key = orderFlatKey(order);
          if (isValid(key, confirmedFlatPointers.get(key))) continue;
          const ref = doc(db, "openFlats", key);
          const snap = await getDoc(ref);
          const current = snap.exists() ? snap.data().orderId : null;
          if (isValid(key, current)) {
            confirmedFlatPointers.set(key, current);
            continue;
          }
          await setDoc(ref, { orderId: order.id });
          confirmedFlatPointers.set(key, order.id);
        }
      } catch (err) {
        console.error("Could not sync openFlats pointers", err);
      } finally {
        syncingFlatPointers = false;
        if (flatPointerSyncPending && auth.currentUser) {
          flatPointerSyncPending = false;
          syncFlatPointers();
        }
      }
    }

    async function deleteOrder(orderId) {
      if (!confirm("Delete this order permanently? This cannot be undone.")) return;
      try {
        await deleteDoc(doc(db, "orders", orderId));
      } catch (err) {
        console.error(err);
        alert("Could not delete order. Please try again.");
      }
    }

    async function saveOrderEdit(orderId, card) {
      const order = allOrders.find((o) => o.id === orderId);
      if (!order) return;

      const apartment = card.querySelector(".edit-apartment").value;
      const flatNumber = card.querySelector(".edit-flat").value.trim();
      const quantity = parseInt(card.querySelector(".edit-quantity").value, 10);

      if (!apartment || !flatNumber || !quantity) {
        alert("Please fill in all fields.");
        return;
      }

      try {
        await updateDoc(doc(db, "orders", orderId), {
          apartment,
          flatNumber,
          quantity,
          total: quantity * order.unitPrice,
        });
        editingOrderId = null;
        render();
      } catch (err) {
        console.error(err);
        alert("Could not save changes. Please try again.");
      }
    }

    function orderCardHTML(order, duplicateCount) {
      if (order.id === editingOrderId) {
        return `
          <div class="top-row">
            <span class="apartment-flat">${order.apartment} · ${order.flatNumber}</span>
            <span class="badge ${order.status}">${order.status}</span>
          </div>
          <div class="field">
            <label>Mobile #</label>
            <input type="tel" value="${order.mobile || "Not provided"}" readonly />
          </div>
          <div class="field">
            <label>Apartment</label>
            <select class="edit-apartment">
              <option value="Navin's" ${order.apartment === "Navin's" ? "selected" : ""}>Navin's</option>
              <option value="Casa Grande" ${order.apartment === "Casa Grande" ? "selected" : ""}>Casa Grande</option>
            </select>
          </div>
          <div class="field">
            <label>Flat Number</label>
            <input type="text" class="edit-flat" value="${order.flatNumber}" />
          </div>
          <div class="field">
            <label>Quantity</label>
            <select class="edit-quantity">
              ${[1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${order.quantity === n ? "selected" : ""}>${n}</option>`).join("")}
            </select>
          </div>
          <div class="button-row">
            <button type="button" class="secondary cancel-edit-order">Cancel</button>
            <button type="button" class="primary save-edit-order" data-id="${order.id}">Save</button>
          </div>
        `;
      }

      return `
        <div class="top-row">
          <span class="apartment-flat">${order.apartment} · ${order.flatNumber}</span>
          <span class="badge ${order.status}">${order.status}</span>
        </div>
        ${duplicateCount > 1 ? `<div class="duplicate-warning">⚠️ Possible duplicate: ${duplicateCount} open orders for this flat. Please verify.</div>` : ""}
        <div class="details">
          <div>${order.product} × ${order.quantity} — ₹${order.total}</div>
          ${order.mobile ? `<div>Mobile: <a href="tel:${order.mobile}">${order.mobile}</a></div>` : ""}
          <div>Ordered: ${formatDate(order.createdAt)}</div>
          ${order.status === "closed" ? `<div>Delivered: ${formatDate(order.closedAt)}</div>` : ""}
          ${order.status === "cancelled" ? `<div>Cancelled: ${formatDate(order.cancelledAt)}</div>` : ""}
        </div>
        <div class="order-actions">
          ${order.status === "open"
            ? `<button class="mark-closed" data-id="${order.id}">Mark Delivered</button>`
            : `<button class="primary reopen-order" data-id="${order.id}">Reopen Order</button>`}
          <button class="icon-btn small edit-order" data-id="${order.id}" aria-label="Edit order">✏️</button>
          <button class="icon-btn small delete-order" data-id="${order.id}" aria-label="Delete order">🗑️</button>
        </div>
      `;
    }

    function render() {
      const filtered = allOrders.filter((o) => {
        if (currentFilter === "all") return true;
        return o.status === currentFilter;
      });

      const openOrders = allOrders.filter((o) => o.status === "open");
      openCountEl.textContent = openOrders.length;
      openTotalEl.textContent = `₹${openOrders.reduce((sum, o) => sum + (o.total || 0), 0)}`;

      if (filtered.length === 0) {
        ordersContainer.innerHTML = `<div class="empty-state">No ${currentFilter === "all" ? "" : currentFilter} orders.</div>`;
        return;
      }

      const flatCounts = openCountsByFlat();
      ordersContainer.innerHTML = "";
      filtered.forEach((order) => {
        const duplicateCount = order.status === "open" ? flatCounts.get(orderFlatKey(order)) : 0;
        const card = document.createElement("div");
        card.className = duplicateCount > 1 ? "order-card duplicate" : "order-card";
        card.dataset.id = order.id;
        card.innerHTML = orderCardHTML(order, duplicateCount);
        ordersContainer.appendChild(card);
      });

      ordersContainer.querySelectorAll(".mark-closed").forEach((btn) => {
        btn.addEventListener("click", () => markClosed(btn.dataset.id));
      });

      ordersContainer.querySelectorAll(".reopen-order").forEach((btn) => {
        btn.addEventListener("click", () => reopenOrder(btn.dataset.id));
      });

      ordersContainer.querySelectorAll(".edit-order").forEach((btn) => {
        btn.addEventListener("click", () => {
          editingOrderId = btn.dataset.id;
          render();
        });
      });

      ordersContainer.querySelectorAll(".delete-order").forEach((btn) => {
        btn.addEventListener("click", () => deleteOrder(btn.dataset.id));
      });

      ordersContainer.querySelectorAll(".cancel-edit-order").forEach((btn) => {
        btn.addEventListener("click", () => {
          editingOrderId = null;
          render();
        });
      });

      ordersContainer.querySelectorAll(".save-edit-order").forEach((btn) => {
        btn.addEventListener("click", () => {
          const card = btn.closest(".order-card");
          saveOrderEdit(btn.dataset.id, card);
        });
      });
    }

    function renderProductView() {
      productNameDisplay.textContent = currentProduct.name;
      productPriceDisplay.textContent = `₹${currentProduct.price}`;
    }

    function showProductEdit() {
      productNameInput.value = currentProduct.name;
      productPriceInput.value = currentProduct.price;
      productStatusEl.className = "status-message";
      productView.hidden = true;
      productEditForm.hidden = false;
    }

    function showProductView() {
      productView.hidden = false;
      productEditForm.hidden = true;
    }

    function startProductListener() {
      unsubscribeProduct = onSnapshot(
        productDocRef,
        async (snap) => {
          if (snap.exists()) {
            currentProduct = snap.data();
            renderProductView();
          } else {
            // First run: seed the product doc with the current default values.
            try {
              await setDoc(productDocRef, currentProduct);
            } catch (err) {
              console.error("Could not seed product doc", err);
            }
          }
        },
        (err) => console.error(err)
      );
    }

    function stopProductListener() {
      if (unsubscribeProduct) {
        unsubscribeProduct();
        unsubscribeProduct = null;
      }
    }

    productEditBtn.addEventListener("click", showProductEdit);
    productCancelBtn.addEventListener("click", showProductView);

    productEditForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = productNameInput.value.trim();
      const price = Number(productPriceInput.value);

      if (!name || !price || price <= 0) {
        productStatusEl.textContent = "Please enter a valid name and price.";
        productStatusEl.className = "status-message show error";
        return;
      }

      productSaveBtn.disabled = true;
      productSaveBtn.textContent = "Saving...";
      try {
        await setDoc(productDocRef, { name, price });
        showProductView();
      } catch (err) {
        console.error(err);
        productStatusEl.textContent = "Could not save. Please try again.";
        productStatusEl.className = "status-message show error";
      } finally {
        productSaveBtn.disabled = false;
        productSaveBtn.textContent = "Save";
      }
    });

    function renderFreeze() {
      freezeStateEl.textContent = ordersFrozen
        ? "Frozen: customers cannot place, modify or cancel orders."
        : "Open: customers can place, modify and cancel orders.";
      freezeStateEl.classList.toggle("frozen", ordersFrozen);
      freezeBtn.textContent = ordersFrozen ? "Unfreeze Orders" : "Freeze Orders";
      freezeBtn.className = ordersFrozen ? "primary" : "danger";
      freezeBtn.disabled = false;
    }

    // config/settings is created the first time the admin freezes orders; a missing doc means not frozen.
    function startSettingsListener() {
      unsubscribeSettings = onSnapshot(
        settingsDocRef,
        (snap) => {
          ordersFrozen = snap.exists() && snap.data().ordersFrozen === true;
          renderFreeze();
        },
        (err) => {
          console.error(err);
          freezeStateEl.textContent = "Could not load the freeze setting.";
        }
      );
    }

    function stopSettingsListener() {
      if (unsubscribeSettings) {
        unsubscribeSettings();
        unsubscribeSettings = null;
      }
    }

    freezeBtn.addEventListener("click", async () => {
      const freeze = !ordersFrozen;
      const question = freeze
        ? "Freeze orders? Customers will not be able to place, modify or cancel orders."
        : "Unfreeze orders? Customers will be able to place, modify and cancel orders again.";
      if (!confirm(question)) return;
      freezeBtn.disabled = true;
      try {
        await setDoc(settingsDocRef, { ordersFrozen: freeze });
      } catch (err) {
        console.error(err);
        alert("Could not update the freeze setting. Please try again.");
        freezeBtn.disabled = false;
      }
    });

    function startOrdersListener() {
      const ordersQuery = query(collection(db, "orders"), orderBy("createdAt", "desc"));
      unsubscribeOrders = onSnapshot(
        ordersQuery,
        (snapshot) => {
          allOrders = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
          render();
          syncFlatPointers();
        },
        (err) => {
          console.error(err);
          ordersContainer.innerHTML = `<div class="empty-state">Failed to load orders: ${err.message}</div>`;
        }
      );
    }

    function stopOrdersListener() {
      if (unsubscribeOrders) {
        unsubscribeOrders();
        unsubscribeOrders = null;
      }
      allOrders = [];
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginScreen.hidden = true;
        dashboardScreen.hidden = false;
        loginStatusEl.className = "status-message";
        loginForm.reset();
        startOrdersListener();
        startProductListener();
        startSettingsListener();
      } else {
        loginScreen.hidden = false;
        dashboardScreen.hidden = true;
        stopOrdersListener();
        stopProductListener();
        stopSettingsListener();
      }
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginStatusEl.className = "status-message";
      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";
      try {
        await signInWithEmailAndPassword(auth, emailEl.value.trim(), passwordEl.value);
      } catch (err) {
        console.error(err);
        loginStatusEl.textContent = "Incorrect email or password.";
        loginStatusEl.className = "status-message show error";
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));
  </script>
</body>

</html>
